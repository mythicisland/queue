syntax = "proto3";

package mythicisland.queue.v1;

import "mythicisland/queue/v1/types.proto";

option java_package = "net.mythicisland.queue.v1";
option java_multiple_files = true;

message TicketCreatedEvent {
  Ticket ticket = 1;
}

message TicketStateChangedEvent {
  Ticket ticket = 1;
  TicketState previous_state = 2;
}

message TicketDeletedEvent {
  Ticket ticket = 1;
  TicketDeleteReason reason = 2;
}

enum TicketDeleteReason {
  TICKET_DELETE_REASON_UNSPECIFIED = 0;
  TICKET_DELETE_REASON_CANCELLED = 1;
  TICKET_DELETE_REASON_TRANSFERRED = 2;
  TICKET_DELETE_REASON_DISCONNECTED = 3;
}

message MatchCreatedEvent {
  Match match = 1;
}

message MatchStateChangedEvent {
  Match match = 1;
  MatchState previous_state = 2;
}

message MatchTransferredEvent {
  Match match = 1;
  repeated string transferred_player_ids = 2;
  repeated string missing_player_ids = 3;
}

message MatchReleasedEvent {
  Match match = 1;
  MatchReleaseReason reason = 2;
}

enum MatchReleaseReason {
  MATCH_RELEASE_REASON_UNSPECIFIED = 0;
  MATCH_RELEASE_REASON_RELEASED = 1;
  MATCH_RELEASE_REASON_SERVER_STOPPED = 2;
}
