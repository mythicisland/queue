syntax = "proto3";

package mythicisland.queue.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_package = "net.mythicisland.queue.v1";
option java_multiple_files = true;

message Ticket {
  string id = 1;
  repeated string player_ids = 2;
  repeated string queue_types = 3;
  TicketState state = 4;
  string match_id = 5;
  Assignment assignment = 6;
  google.protobuf.Timestamp countdown_end_time = 7;
  google.protobuf.Timestamp created_at = 8;
  map<string, string> properties = 9;
}

enum TicketState {
  TICKET_STATE_UNSPECIFIED = 0;
  TICKET_STATE_SEARCHING = 1;
  TICKET_STATE_MATCHED = 2;
  TICKET_STATE_ASSIGNED = 3;
}

message Match {
  string id = 1;
  string queue_type = 2;
  repeated Ticket tickets = 3;
  repeated Team teams = 4;
  MatchState state = 5;
  Assignment assignment = 6;
  google.protobuf.Timestamp countdown_end_time = 7;
  google.protobuf.Timestamp created_at = 8;
}

message Team {
  repeated string player_ids = 1;
}

enum MatchState {
  MATCH_STATE_UNSPECIFIED = 0;
  MATCH_STATE_ALLOCATING = 1;
  MATCH_STATE_OFFERED = 2;
  MATCH_STATE_COUNTDOWN = 3;
  MATCH_STATE_TRANSFERRING = 4;
  MATCH_STATE_COMPLETED = 5;
  MATCH_STATE_FAILED = 6;
  MATCH_STATE_CANCELLED = 7;
}

message Assignment {
  string server_id = 1;
  string server_name = 2;
}

message QueueType {
  string name = 1;
  ServerConfig server = 2;
  MatchConfig match = 3;
  map<string, string> properties = 4;
}

message ServerConfig {
  string group = 1;
  google.protobuf.Duration allocation_timeout = 2;
  oneof mode {
    ExclusiveMode exclusive = 3;
    SharedMode shared = 4;
  }
}

message ExclusiveMode {}

message SharedMode {
  google.protobuf.Duration accept_timeout = 1;
  optional uint32 capacity = 2;
}

message MatchConfig {
  uint32 min_players = 1;
  uint32 max_players = 2;
  google.protobuf.Duration fill_time = 3;
  google.protobuf.Duration countdown = 4;
  optional TeamConfig teams = 5;
  PartyConfig parties = 6;
}

message TeamConfig {
  uint32 count = 1;
  uint32 size = 2;
}

message PartyConfig {
  uint32 max_size = 1;
}

message QueueStats {
  string queue_type = 1;
  uint32 searching_tickets = 2;
  uint32 searching_players = 3;
  uint32 active_matches = 4;
}
