syntax = "proto3";

package mythicisland.queue.v1;

import "mythicisland/queue/v1/types.proto";

option java_package = "net.mythicisland.queue.v1";
option java_multiple_files = true;

service TicketService {
  // Puts the players into matchmaking as one ticket.
  //
  // Errors:
  // - INVALID_ARGUMENT: no players or queue types, the ticket is larger than the party limit
  //   of one of the queue types, or the properties exceed their limits.
  // - NOT_FOUND: one of the queue types does not exist.
  // - ALREADY_EXISTS: one of the players already has a ticket.
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
  // Takes a ticket out of matchmaking.
  //
  // Errors:
  // - NOT_FOUND: there is no such ticket, or the player has none.
  rpc DeleteTicket(DeleteTicketRequest) returns (DeleteTicketResponse);
  // Sets the given properties and removes the given keys, all other properties stay as they are.
  // A key that is set and removed at once is set.
  //
  // Errors:
  // - INVALID_ARGUMENT: the properties exceed their limits afterwards.
  // - NOT_FOUND: there is no such ticket, or the player has none.
  rpc UpdateTicketProperties(UpdateTicketPropertiesRequest) returns (UpdateTicketPropertiesResponse);
}

message CreateTicketRequest {
  repeated string player_ids = 1;
  repeated string queue_types = 2;
  map<string, string> properties = 3;
}

message CreateTicketResponse {
  Ticket ticket = 1;
}

message DeleteTicketRequest {
  oneof target {
    string ticket_id = 1;
    string player_id = 2;
  }
}

message DeleteTicketResponse {}

message UpdateTicketPropertiesRequest {
  oneof target {
    string ticket_id = 1;
    string player_id = 2;
  }
  map<string, string> properties = 3;
  repeated string removed_keys = 4;
}

message UpdateTicketPropertiesResponse {
  Ticket ticket = 1;
}

service GameServerService {
  // Accepts an offered match, the countdown starts.
  //
  // Errors:
  // - NOT_FOUND: the match does not exist.
  // - PERMISSION_DENIED: the match is not offered to this server.
  // - FAILED_PRECONDITION: the match is not in OFFERED, for example because the offer timed out.
  rpc AcceptMatch(AcceptMatchRequest) returns (AcceptMatchResponse);
  // Rejects an offered match, it is offered to the next server but never again to this one.
  //
  // Errors: the same as AcceptMatch.
  rpc RejectMatch(RejectMatchRequest) returns (RejectMatchResponse);
  // Frees the place of a finished match on its server.
  //
  // Errors:
  // - NOT_FOUND: the match does not exist.
  // - PERMISSION_DENIED: the match is not hosted by this server.
  // - FAILED_PRECONDITION: the match is not in COMPLETED.
  rpc ReleaseMatch(ReleaseMatchRequest) returns (ReleaseMatchResponse);
}

message AcceptMatchRequest {
  string server_id = 1;
  string match_id = 2;
}

message AcceptMatchResponse {
  Match match = 1;
}

message RejectMatchRequest {
  string server_id = 1;
  string match_id = 2;
  string reason = 3;
}

message RejectMatchResponse {}

message ReleaseMatchRequest {
  string server_id = 1;
  string match_id = 2;
}

message ReleaseMatchResponse {}

service QueueDataService {
  rpc GetTicket(GetTicketRequest) returns (GetTicketResponse);
  rpc GetTicketByPlayer(GetTicketByPlayerRequest) returns (GetTicketByPlayerResponse);
  rpc ListTickets(ListTicketsRequest) returns (ListTicketsResponse);

  rpc GetMatch(GetMatchRequest) returns (GetMatchResponse);
  rpc ListMatches(ListMatchesRequest) returns (ListMatchesResponse);

  rpc GetQueueType(GetQueueTypeRequest) returns (GetQueueTypeResponse);
  rpc ListQueueTypes(ListQueueTypesRequest) returns (ListQueueTypesResponse);

  rpc GetQueueStats(GetQueueStatsRequest) returns (GetQueueStatsResponse);
  rpc ListQueueStats(ListQueueStatsRequest) returns (ListQueueStatsResponse);
}

message GetTicketRequest {
  string ticket_id = 1;
}

message GetTicketResponse {
  Ticket ticket = 1;
}

message GetTicketByPlayerRequest {
  string player_id = 1;
}

message GetTicketByPlayerResponse {
  Ticket ticket = 1;
}

message ListTicketsRequest {
  string queue_type = 1;
}

message ListTicketsResponse {
  repeated Ticket tickets = 1;
}

message GetMatchRequest {
  string match_id = 1;
}

message GetMatchResponse {
  Match match = 1;
}

message ListMatchesRequest {
  string queue_type = 1;
  string server_id = 2;
}

message ListMatchesResponse {
  repeated Match matches = 1;
}

message GetQueueTypeRequest {
  string name = 1;
}

message GetQueueTypeResponse {
  QueueType queue_type = 1;
}

message ListQueueTypesRequest {}

message ListQueueTypesResponse {
  repeated QueueType queue_types = 1;
}

message GetQueueStatsRequest {
  string queue_type = 1;
}

message GetQueueStatsResponse {
  QueueStats stats = 1;
}

message ListQueueStatsRequest {}

message ListQueueStatsResponse {
  repeated QueueStats stats = 1;
}
