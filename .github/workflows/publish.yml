name: publish

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Prerelease -> snapshots, Release -> releases
  MAVEN_REPOSITORY: ${{ github.event.release.prerelease && 'Snapshots' || 'Releases' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check release tag matches project version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match project version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: ./gradlew build

  maven:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to ${{ env.MAVEN_REPOSITORY }}
        env:
          MYTHICISLAND_USERNAME: ${{ secrets.MYTHICISLAND_USERNAME }}
          MYTHICISLAND_PASSWORD: ${{ secrets.MYTHICISLAND_PASSWORD }}
        run: ./gradlew publishAllPublicationsTo${MAVEN_REPOSITORY}Repository

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAGS="$VERSION,v$VERSION"
          # Only full releases move the "latest" tag
          if [ "$PRERELEASE" != "true" ]; then
            TAGS="$TAGS,latest"
          fi
          echo "Pushing tags: $TAGS"
          ./gradlew :queue-runtime:jib -Djib.to.tags="$TAGS" -Djib.console=plain

  velocity:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        run: ./gradlew :queue-velocity:shadowJar

      - name: Upload plugin to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" queue-velocity/build/libs/queue-velocity.jar --clobber

  cli:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          workdir: cli
          version: "~> v2"
          args: release --clean --skip=publish

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" cli/dist/*.tar.gz cli/dist/*.zip cli/dist/queue-cli_checksums.txt --clobber

  chart:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package & push chart
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          helm package charts/queue --version "$VERSION" --app-version "$VERSION"
          helm push "queue-$VERSION.tgz" oci://ghcr.io/mythicisland/charts
