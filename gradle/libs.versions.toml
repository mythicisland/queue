[versions]
# Kotlin
kotlin = "2.4.21"
kotlin-coroutines = "1.11.0"

# Plugins
shadow = "9.6.1"
jib = "3.5.4"
kraken = "1.1.1"

# Logging
log4j = "2.26.1"
slf4j = "2.0.20"

# Telemetry
opentelemetry = "1.67.0"
opentelemetry-instrumentation = "2.33.1-alpha"

# Configuration & CLI
clikt = "5.1.0"
configurate = "4.2.0"

# gRPC & Protobuf
protobuf = "4.36.2"
grpc = "1.85.1"
grpc-kotlin = "1.5.0"
queue-protos = "1.5.0.4.20261027192600.6bfe0d7a03af"

# Infrastructure
jnats = "2.26.4"
simplecloud-api = "0.1.0-platform.59-dev.6.1-9cfd057"

[libraries]
# Kotlin
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }

# Logging
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-layout-template-json = { module = "org.apache.logging.log4j:log4j-layout-template-json", version.ref = "log4j" }
log4j-slf4j2-impl ={ module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Telemetry
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk-autoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-runtime-telemetry = { module = "io.opentelemetry.instrumentation:opentelemetry-runtime-telemetry", version.ref = "opentelemetry-instrumentation" }
opentelemetry-grpc = { module = "io.opentelemetry.instrumentation:opentelemetry-grpc-1.6", version.ref = "opentelemetry-instrumentation" }

# Configuration & CLI
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
configurate-extra-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }

# gRPC & Protobuf
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
queue-protos = { module = "build.buf.gen:mythicisland_queue_grpc_kotlin", version.ref = "queue-protos" }

# Infrastructure
jnats = { module = "io.nats:jnats", version.ref = "jnats" }
simplecloud-api = { module = "app.simplecloud.api:api", version.ref = "simplecloud-api" }

[bundles]
logging = ["log4j-core", "log4j-api", "log4j-layout-template-json", "log4j-slf4j2-impl", "slf4j-api"]
configurate = ["configurate-yaml", "configurate-extra-kotlin"]
opentelemetry = ["opentelemetry-api", "opentelemetry-sdk-autoconfigure", "opentelemetry-exporter-otlp", "opentelemetry-runtime-telemetry", "opentelemetry-grpc"]
grpc = ["grpc-stub", "grpc-netty-shaded", "grpc-kotlin-stub", "grpc-protobuf", "protobuf-kotlin"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
kraken = { id = "dev.xxjanisxx.kraken", version.ref = "kraken" }