[versions]
# Kotlin
kotlin = "2.3.20"

# Logging
log4j = "2.25.4"
slf4j = "2.0.17"

# Configurate
configurate = "4.2.0"

# Plugins
shadow = "9.4.1"

# Other dependencies
kotlinx-coroutines = "1.10.2"
clikt = "5.1.0"
jnats = "2.25.2"
adventure = "4.26.1"
cloud-api = "0.1.0-platform.23-dev.1775473227066-1c0c25a"
queue-proto = "1.5.0.2.20260404223810.d11d2b06e28c"
postgre = "42.7.10"

# Proto Buf
protobuf = "4.34.1"
grpc = "1.81.0"
grpc-kotlin = "1.5.0"

# JOOQ
jooq = "3.21.1"

[libraries]
# Kotlin
kotlin-jvm = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Logging
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-slf4j-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Configurate
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
configurate-extra-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate" }

# Other dependencies
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }
postgre-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgre" }
cloud-api = { module = "app.simplecloud.api:api", version.ref = "cloud-api" }
queue-proto = { module = "build.buf.gen:mythicisland_queue_grpc_kotlin", version.ref = "queue-proto" }

# Adventure
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }

# JOOQ
jooq = { module = "org.jooq:jooq-kotlin", version.ref = "jooq" }
jooq-meta = { module = "org.jooq:jooq-meta", version.ref = "jooq" }
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }
jooq-kotlin-coroutines = { module = "org.jooq:jooq-kotlin-coroutines", version.ref = "jooq" }

# Proto Buf
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }

grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }

[bundles]
logging = ["log4j-core", "log4j-api", "log4j-slf4j-impl", "slf4j-api"]
adventure = ["adventure-api", "adventure-text-minimessage"]
configurate = ["configurate-yaml", "configurate-extra-kotlin"]
jooq = ["jooq-kotlin-coroutines", "jooq", "jooq-meta-extensions", "jooq-meta"]
grpc = ["grpc-stub", "grpc-netty-shaded", "grpc-kotlin-stub", "grpc-protobuf", "protobuf-kotlin"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }