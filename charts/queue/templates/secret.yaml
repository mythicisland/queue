{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "queue.fullname" . }}
  labels:
    {{- include "queue.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-secret: {{ required "auth.secret is required when existingSecret is not set" .Values.auth.secret | quote }}
  nats-password: {{ required "nats.password is required when existingSecret is not set" .Values.nats.password | quote }}
  network-id: {{ required "simplecloud.networkId is required when existingSecret is not set" .Values.simplecloud.networkId | quote }}
  network-secret: {{ required "simplecloud.networkSecret is required when existingSecret is not set" .Values.simplecloud.networkSecret | quote }}
{{- end }}
