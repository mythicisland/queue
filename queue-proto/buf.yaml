version: v2
modules:
  - path: mythicisland/queue/v1
    name: buf.build/mythicisland/queue
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT